name: agent-engineering CI

permissions:
  contents: read

# 由 ae adopt 產生（分支名稱取自 .agent/config.toml）。檢查邏輯與工具版本在 agent-engineering 裡（ae ci …），升級工具就跟著更新；
# 這裡只放專案自己的部分：語言版本、安裝相依、make check、make coverage
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  AE: .claude/skills/agent-engineering/bin/ae

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 覆蓋率檢查要跟整合分支比 diff
      # 工具本體（ae）：submodule 指到的版本。agent-engineering 是 private 時，到 repo 的 secrets 設 AE_TOKEN
      # （fine-grained token，只給 agent-engineering 的 Contents 唯讀）；public 不用設。不讓 checkout 順便抓 submodule：預設 token 讀不到別的 private repo
      - name: Locate agent-engineering
        id: ae
        run: |
          url=$(git config -f .gitmodules --get submodule..claude/skills/agent-engineering.url)
          repo=${url#https://github.com/}
          echo "repo=${repo%.git}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD:.claude/skills/agent-engineering)" >> "$GITHUB_OUTPUT"
      - name: Checkout agent-engineering
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.ae.outputs.repo }}
          ref: ${{ steps.ae.outputs.sha }}
          path: .claude/skills/agent-engineering
          token: ${{ secrets.AE_TOKEN || github.token }}
          persist-credentials: false   # 後面會跑專案的程式，不留 token
      - name: Set up Python  # 不要刪：ae 需要 3.11 以上，跟專案語言無關
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 專案初始化（project-init）合併前還沒有 Makefile，後續步驟全部跳過
      - name: Detect Makefile
        id: detect
        run: if [ -f Makefile ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      # TODO(project-init): architect 依技術棧加上語言版本，例：actions/setup-node@v4
      # CI 用 .env.example 的預設值；需要機密的測試改用 GitHub secrets
      - name: Prepare env
        if: steps.detect.outputs.found == 'true'
        run: if [ -f .env.example ]; then cp .env.example .env; fi
      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: make ci-setup
      - name: Check
        if: steps.detect.outputs.found == 'true'
        run: make check
      # 改到的程式碼覆蓋率（門檻 80%）：只在開到整合分支的 PR 檢查；發版 PR 是已逐張檢查過的累積
      # make coverage 把 Cobertura／JaCoCo XML 寫到 coverage-reports/（寫法見 agent-engineering 的 backend-standards skill）
      # 需要 DB 時在這步之前加 docker compose up -d <服務>：測試在 runner 上跑，在容器裡跑報告路徑會對不回 repo
      - name: Coverage of changed lines
        if: steps.detect.outputs.found == 'true' && github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          # TODO(project-init): 用 JaCoCo（Java／Kotlin）時填原始碼目錄，空白分隔，例："backend/src/main/java"
          COVERAGE_SRC_ROOTS: ""
        run: |
          make coverage
          "$AE" ci coverage-gate

  # 資安稽核：每個 PR 都跑，ae pr merge 要求所有 check 綠
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 密鑰掃描要看整段歷史，刪掉的 secret 仍在 git 裡
      # 工具本體（ae）：submodule 指到的版本。agent-engineering 是 private 時，到 repo 的 secrets 設 AE_TOKEN
      # （fine-grained token，只給 agent-engineering 的 Contents 唯讀）；public 不用設。不讓 checkout 順便抓 submodule：預設 token 讀不到別的 private repo
      - name: Locate agent-engineering
        id: ae
        run: |
          url=$(git config -f .gitmodules --get submodule..claude/skills/agent-engineering.url)
          repo=${url#https://github.com/}
          echo "repo=${repo%.git}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD:.claude/skills/agent-engineering)" >> "$GITHUB_OUTPUT"
      - name: Checkout agent-engineering
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.ae.outputs.repo }}
          ref: ${{ steps.ae.outputs.sha }}
          path: .claude/skills/agent-engineering
          token: ${{ secrets.AE_TOKEN || github.token }}
          persist-credentials: false   # 後面會跑專案的程式，不留 token
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan (gitleaks, osv-scanner, semgrep)
        run: '"$AE" ci security'
