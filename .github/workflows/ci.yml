name: CI

permissions:
  contents: read

# PR 開到 develop / main 時先跑一次；合併（push）到 develop / main 後再跑一次
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  py-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Pre-commit
        uses: pre-commit/action@v3.0.1

  py-bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Bandit
        run: |
          pip install bandit==1.7.8
          bandit -r src -lll -iii --exit-zero

  py-unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run unit tests
        run: uv run pytest tests/unit

  py-integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --dev
      # ubuntu runner 內建 Docker，testcontainers 可直接啟動 Kafka / PG
      - name: Run integration tests
        run: uv run pytest tests/integration
        env:
          # NOTE: runner 連 Docker Hub 常撞到 rate limit 或逾時（2026-10-10，登入也逾時），改走 Google 鏡像
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          # NOTE: 加前綴後 Ryuk 會無限遞迴建立自己（testcontainers 4.15）；runner 用完即丟，不需清理
          TESTCONTAINERS_RYUK_DISABLED: "true"
