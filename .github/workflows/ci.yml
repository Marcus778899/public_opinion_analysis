name: CI

permissions:
  contents: read

# PR 開到 develop / main 時先跑一次；合併（push）到 develop / main 後再跑一次
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 專案初始化（INIT）合併前還沒有 Makefile，後續步驟全部跳過
      - name: Detect Makefile
        id: detect
        run: if [ -f Makefile ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        if: steps.detect.outputs.found == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # CI 用 .env.example 的預設值；需要機密的測試改用 GitHub secrets
      - name: Prepare env
        if: steps.detect.outputs.found == 'true'
        run: if [ -f .env.example ]; then cp .env.example .env; fi
      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: make ci-setup
      - name: Check
        if: steps.detect.outputs.found == 'true'
        run: make check

  # 整合測試用 compose 的 kafka／postgres／clickhouse／grafana（開發規格 7.25、7.26）；測試在 runner 上跑，報告路徑才對得回 repo
  # 每個事件只跑一次，覆蓋率閘門只在開到 develop 的 PR；只改文件時其餘步驟以 if 跳過（job 仍回報成功）
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 判斷改了哪些檔案、覆蓋率要跟 develop 比 diff
      # NOTE: 不在 on: 以路徑過濾：workflow 不跑時 check 不會出現，合併流程等不到全綠
      - name: Detect code changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "比不到基準 commit，當作有改程式"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          if [ -z "$files" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 變更全在 docs/、tasks/、reports/ 或根目錄 *.md 就跳過
          if echo "$files" | grep -qvE '^(docs/|tasks/|reports/)|^[^/]+\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "只改文件，略過整合測試"; echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      # NOTE: runner 連 Docker Hub 常撞到 rate limit 或逾時，改走 Google 鏡像
      - name: Use Docker Hub mirror
        if: steps.changes.outputs.code == 'true'
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Prepare env
        if: steps.changes.outputs.code == 'true'
        run: cp .env.example .env
      - name: Pull images
        if: steps.changes.outputs.code == 'true'
        run: docker compose --env-file .env -f compose.yaml -f compose.ci.yaml pull kafka postgres clickhouse
      - name: Start services
        if: steps.changes.outputs.code == 'true'
        run: docker compose --env-file .env -f compose.yaml -f compose.ci.yaml up -d --wait kafka postgres clickhouse grafana
      - name: Install uv
        if: steps.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync dependencies
        if: steps.changes.outputs.code == 'true'
        run: uv sync --dev
      - name: Unit and integration tests with coverage
        if: steps.changes.outputs.code == 'true'
        run: |
          port() { grep "^$1=" .env | cut -d= -f2; }
          export IT_KAFKA_BOOTSTRAP="127.0.0.1:$(port IT_KAFKA_HOST_PORT)"
          export IT_POSTGRES_HOST=127.0.0.1
          export IT_POSTGRES_PORT="$(port IT_POSTGRES_HOST_PORT)"
          export IT_CLICKHOUSE_URL="http://127.0.0.1:$(port IT_CLICKHOUSE_HOST_PORT)"
          export IT_GRAFANA_URL="http://127.0.0.1:$(port IT_GRAFANA_HOST_PORT)"
          make coverage
      # 改到的程式碼覆蓋率（scripts/coverage_gate.py，門檻 80%）：發版 PR 是已逐張檢查過的累積，不檢查
      - name: Set up Python for coverage gate  # 不要刪：coverage_gate.py 與 diff-cover 需要，跟專案語言無關
        if: steps.changes.outputs.code == 'true' && github.event_name == 'pull_request' && github.base_ref == 'develop'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coverage of changed lines (diff-cover)
        if: steps.changes.outputs.code == 'true' && github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          DIFF_COVER_VERSION: "10.6.0"
          COVERAGE_SRC_ROOTS: ""
        run: |
          pip install -q "diff-cover==${DIFF_COVER_VERSION}"
          python3 scripts/coverage_gate.py "origin/${GITHUB_BASE_REF}"

  # 資安稽核：每個 PR 都跑，pr.py merge 要求所有 check 綠。工具與語言無關，版本固定，升級改這裡
  # 要忽略某個發現，寫進 osv-scanner.toml／.gitleaksignore／.semgrepignore 並附理由；這些檔在 fast 通道是受保護路徑，發版前 security 也會逐條檢查
  security:
    name: Security
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      OSV_SCANNER_VERSION: "2.6.0"
      SEMGREP_VERSION: "1.178.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 密鑰掃描要看整段歷史，刪掉的 secret 仍在 git 裡
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - name: Dependencies (osv-scanner)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source -r .
          code=$?
          set -e
          # 128：找不到任何相依清單（例：專案初始化前），不算失敗
          if [ "$code" -eq 128 ]; then echo "沒有相依清單，略過"; exit 0; fi
          exit "$code"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SAST (semgrep)
        run: |
          pip install -q "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/default --severity ERROR --error --metrics off --quiet
