[project]
name = "public-opinion-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11,<4",
    "confluent-kafka[avro]>=2.12.2,<2.13",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "loggerhelper",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "quixstreams>=3.28.1,<4",
    "scikit-learn>=1.9.1",
    "selectolax>=1.0.0",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "testcontainers[kafka,postgres]>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "radar"

[tool.ruff]
line-length = 100
target-version = "py312"
# NOTE: scripts/、templates/、.claude/ 歸 agent-engineering 範本（update.sh 覆蓋），不套專案的 lint
extend-exclude = ["docs", "scripts", "templates", ".claude"]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: 端到端測試，需先 make e2e-up，只由 make e2e 執行"]
# NOTE: sandbox 禁止讀 .env，連 stat 都不行；不先 ignore，pytest 走訪根目錄時就會失敗
addopts = "-m 'not e2e' --ignore=.env"

[tool.uv.sources]
loggerhelper = { path = "lib/loggerhelper-2.0.0-py3-none-any.whl" }
