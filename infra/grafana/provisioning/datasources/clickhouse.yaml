apiVersion: 1

datasources:
  - name: ClickHouse
    uid: radar-clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: ${CLICKHOUSE_GRAFANA_USER}
      defaultDatabase: ${CLICKHOUSE_DB}
      # NOTE: 低於 grafana.xml 的 max_execution_time 上限 60；driver 會依逾時帶設定，readonly 帳號不能超過
      queryTimeout: '30'
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
