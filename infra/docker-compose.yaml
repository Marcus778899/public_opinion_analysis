name: radar

# Kafka 節點共用設定；各節點只差 NODE_ID、EXTERNAL port 與 volume
x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: 'broker,controller'
  CLUSTER_ID: ${CLUSTER_ID}
  KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_QUORUM_VOTERS}
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
  KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  # NOTE: image 預設寫在 /tmp/kafka-logs；不指定時 volume 是空的，移除 container 就丟掉所有資料
  KAFKA_LOG_DIRS: '/var/lib/kafka/data'
  # 3 節點：預設 3 份副本、至少 2 份寫入成功（容許 1 個節點掛掉）
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

# 自寫服務共用設定（設計文件 10.3）：同一個 image，只有 command 不同；make up-app 才啟動
x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: 'kafka_1:29092,kafka_2:29092,kafka_3:29092'
  POSTGRES_HOST: 'postgres'
  POSTGRES_PORT: '5432'
  CLICKHOUSE_URL: 'http://clickhouse:8123'
  SCHEMA_REGISTRY_URL: 'http://apicurio:8080/apis/ccompat/v7'
  LOG_DIR: '/app/log'

# NOTE: image 只由 init 建置；其他服務沿用，避免多個服務同時建置同一個 tag 互相衝突
x-app: &app
  image: radar-app:latest
  pull_policy: never
  restart: unless-stopped
  profiles: ["app"]
  env_file: ../.env
  volumes:
    - app_logs:/app/log
  depends_on:
    init:
      condition: service_completed_successfully

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"]
  interval: 10s
  timeout: 10s
  retries: 10

services:
  # ======= Kafka node 1 =======
  kafka_1:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: radar_kafka_1
    hostname: kafka_1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka_1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9092'
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  # ======= Kafka node 2 =======
  kafka_2:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: radar_kafka_2
    hostname: kafka_2
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka_2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9094'
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  # ======= Kafka node 3 =======
  kafka_3:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: radar_kafka_3
    hostname: kafka_3
    restart: unless-stopped
    ports:
      - "9096:9096"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9096,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka_3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9096'
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  # ======= PostgreSQL =======
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: radar_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Debezium 需要 logical decoding；表結構由 Alembic 管理，不放 init SQL
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ======= 自寫服務（profile: app）=======
  # 一次性：建表與建立 topic（皆冪等），完成後其他服務才啟動
  init:
    image: radar-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: radar_init
    profiles: ["app"]
    env_file: ../.env
    # 順序見開發規格 7.9：ClickHouse 表先建好，connector 才開始產生 CDC 事件
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && python scripts/create_topics.py
        && python scripts/migrate_clickhouse.py && python scripts/register_connector.py
    environment:
      <<: *app-env
      CONNECT_URL: 'http://connect:8083'
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      connect:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka_1:
        condition: service_healthy
      kafka_2:
        condition: service_healthy
      kafka_3:
        condition: service_healthy

  api:
    <<: *app
    container_name: radar_api
    command: ["uvicorn", "radar.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
    # 沒有身分驗證，只開放本機連線（設計文件 4.3）
    ports:
      - "127.0.0.1:8000:8000"

  scheduler:
    <<: *app
    # 只能 1 個；多開時其餘的會等 advisory lock（standby）
    container_name: radar_scheduler
    command: ["python", "-m", "radar.collector.scheduler"]
    environment:
      <<: *app-env
      SCHEDULER_API_URL: 'http://api:8000'

  crawler:
    <<: *app
    command: ["python", "-m", "radar.collector.crawler"]
    environment:
      <<: *app-env
    # 一個列表任務可能需要 1 分鐘以上；預設 10 秒會在批次中途被強制結束（開發規格 2.2）
    stop_grace_period: 90s
    deploy:
      replicas: 3

  ingest:
    <<: *app
    container_name: radar_ingest
    command: ["python", "-m", "radar.ingest.main"]
    environment:
      <<: *app-env

  # 串流抽樣標註（S3-08）：會持續呼叫 LLM API，獨立 profile，make up-labeling 才啟動
  label-stream:
    <<: *app
    container_name: radar_label_stream
    profiles: ["labeling"]
    command: ["python", "-m", "radar.ml.labeling.stream"]
    environment:
      <<: *app-env

  # ======= CDC（設計文件 6.1）=======
  # 一次性：建立 Apicurio 專用的 database（冪等）；PG init script 只在空 volume 時執行，既有環境不會跑
  apicurio-db-init:
    image: postgres:${POSTGRES_VERSION}
    container_name: radar_apicurio_db_init
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'apicurio'" | grep -q 1
        || psql -c 'CREATE DATABASE apicurio'
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  apicurio:
    image: apicurio/apicurio-registry:${APICURIO_VERSION}
    container_name: radar_apicurio
    restart: unless-stopped
    environment:
      APICURIO_STORAGE_KIND: 'sql'
      APICURIO_STORAGE_SQL_KIND: 'postgresql'
      # NOTE: 不可與 radar 共用 database，否則 Alembic autogenerate 會把 Apicurio 的表當成要刪除的表
      APICURIO_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/apicurio'
      APICURIO_DATASOURCE_USERNAME: ${POSTGRES_USER}
      APICURIO_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_OPTS_APPEND: ${APICURIO_JAVA_OPTS}
    ports:
      - "127.0.0.1:8080:8080"
    # NOTE: 3.x 沒有 /health/ready（回 404），改查 v3 API
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/apis/registry/v3/system/info > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      apicurio-db-init:
        condition: service_completed_successfully

  connect:
    build:
      context: debezium
      args:
        DEBEZIUM_VERSION: ${DEBEZIUM_VERSION}
        APICURIO_VERSION: ${APICURIO_VERSION}
    image: radar-connect:${DEBEZIUM_VERSION}
    container_name: radar_connect
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: 'kafka_1:29092,kafka_2:29092,kafka_3:29092'
      GROUP_ID: 'radar-connect'
      CONFIG_STORAGE_TOPIC: 'connect_configs'
      OFFSET_STORAGE_TOPIC: 'connect_offsets'
      STATUS_STORAGE_TOPIC: 'connect_statuses'
      HEAP_OPTS: ${CONNECT_HEAP_OPTS}
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    depends_on:
      kafka_1:
        condition: service_healthy
      kafka_2:
        condition: service_healthy
      kafka_3:
        condition: service_healthy
      apicurio:
        condition: service_healthy

  # ======= ClickHouse（設計文件 6.2、6.3）=======
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: radar_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./clickhouse/config.d/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml:ro
      - ./clickhouse/users.d/radar.xml:/etc/clickhouse-server/users.d/radar.xml:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} -q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20


  # ======= Kafka UI（http://localhost:8089）=======
  # TODO(S8-06): 開發期間預設啟動，方便觀察 topic 與 partition；部署前移除（沒有身分驗證）
  kafka-ui:
    image: kafbat/kafka-ui:${KAFKA_UI_VERSION}
    container_name: radar_kafka_ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: 'local'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka_1:29092,kafka_2:29092,kafka_3:29092'
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: 'http://apicurio:8080/apis/ccompat/v7'
    depends_on:
      kafka_1:
        condition: service_healthy
      kafka_2:
        condition: service_healthy
      kafka_3:
        condition: service_healthy
      apicurio:
        condition: service_healthy

volumes:
  app_logs:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  postgres_data:
  clickhouse_data:
