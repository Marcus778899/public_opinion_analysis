name: radar

# Kafka 節點共用設定；各節點只差 NODE_ID、EXTERNAL port 與 volume
x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: 'broker,controller'
  CLUSTER_ID: ${CLUSTER_ID}
  KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_QUORUM_VOTERS}
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
  KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  # 3 節點：預設 3 份副本、至少 2 份寫入成功（容許 1 個節點掛掉）
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

# 自寫服務共用設定（設計文件 10.3）：同一個 image，只有 command 不同；make up-app 才啟動
x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: 'kafka_1:29092,kafka_2:29092,kafka_3:29092'
  POSTGRES_HOST: 'postgres'
  POSTGRES_PORT: '5432'
  LOG_DIR: '/app/log'

# NOTE: image 只由 init 建置；其他服務沿用，避免多個服務同時建置同一個 tag 互相衝突
x-app: &app
  image: radar-app:latest
  pull_policy: never
  restart: unless-stopped
  profiles: ["app"]
  env_file: ../.env
  volumes:
    - app_logs:/app/log
  depends_on:
    init:
      condition: service_completed_successfully

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"]
  interval: 10s
  timeout: 10s
  retries: 10

services:
  # ======= Kafka node 1 =======
  kafka_1:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: radar_kafka_1
    hostname: kafka_1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka_1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9092'
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  # ======= Kafka node 2 =======
  kafka_2:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: radar_kafka_2
    hostname: kafka_2
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka_2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9094'
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  # ======= Kafka node 3 =======
  kafka_3:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: radar_kafka_3
    hostname: kafka_3
    restart: unless-stopped
    ports:
      - "9096:9096"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9096,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka_3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9096'
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  # ======= PostgreSQL =======
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: radar_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Debezium 需要 logical decoding；表結構由 Alembic 管理，不放 init SQL
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ======= 自寫服務（profile: app）=======
  # 一次性：建表與建立 topic（皆冪等），完成後其他服務才啟動
  init:
    image: radar-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: radar_init
    profiles: ["app"]
    env_file: ../.env
    environment:
      <<: *app-env
    command: ["sh", "-c", "alembic upgrade head && python scripts/create_topics.py"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      kafka_1:
        condition: service_healthy
      kafka_2:
        condition: service_healthy
      kafka_3:
        condition: service_healthy

  api:
    <<: *app
    container_name: radar_api
    command: ["uvicorn", "radar.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
    # 沒有身分驗證，只開放本機連線（設計文件 4.3）
    ports:
      - "127.0.0.1:8000:8000"

  scheduler:
    <<: *app
    # 只能 1 個；多開時其餘的會等 advisory lock（standby）
    container_name: radar_scheduler
    command: ["python", "-m", "radar.collector.scheduler"]
    environment:
      <<: *app-env
      SCHEDULER_API_URL: 'http://api:8000'

  crawler:
    <<: *app
    command: ["python", "-m", "radar.collector.crawler"]
    environment:
      <<: *app-env
    deploy:
      replicas: 3

  ingest:
    <<: *app
    container_name: radar_ingest
    command: ["python", "-m", "radar.ingest.main"]
    environment:
      <<: *app-env

  # TODO(S2-03): Apicurio、kafka-connect（Debezium）、kafka-connect-init 依 kafka_tutorial/deployment 的寫法加入

  # ======= Kafka UI（make up-debug 才啟動）=======
  kafka-ui:
    image: kafbat/kafka-ui:${KAFKA_UI_VERSION}
    container_name: radar_kafka_ui
    profiles: ["debug"]
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: 'local'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka_1:29092,kafka_2:29092,kafka_3:29092'
      # TODO(S2-03): KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://apicurio:8080/apis/ccompat/v7
    depends_on:
      kafka_1:
        condition: service_healthy
      kafka_2:
        condition: service_healthy
      kafka_3:
        condition: service_healthy

volumes:
  app_logs:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  postgres_data:
