# 擴充預設規則；只排除 tasks/ 封存路徑（D-018）
# NOTE: tasks/ 已搬到 .agent/tasks/，但 CI 掃整段 git 歷史，舊 commit 仍有 tasks/，這條要留著
# NOTE: 封存派工單與報告會引用誤判內容，逐筆加 fingerprint 會無限循環
title = "radar gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "tasks/ 封存派工單、qa／review 紀錄（D-018）"
paths = ['''^tasks/''']

[[allowlists]]
description = "Git／Hugging Face revision：變數名最後一段是 rev/revision/commit/sha（整段比對）且值為 40 位小寫 hex（D-026）"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(?i:(?:^|[^a-z0-9])(?:rev|revision|commit|sha))\s*[:=]+\s*(?:"[0-9a-f]{40}"|'[0-9a-f]{40}'|[0-9a-f]{40}(?:[^0-9a-zA-Z]|$))''']

# 驗收測試用哨兵假密碼驗「密碼不外洩」；測試已鎖定且 gitleaks 掃歷史，改測試無效
# 只放行 tests/ 底下、值以 sentinel（含 s3ntinel 寫法）加 - 或 _ 開頭的 generic-api-key
[[allowlists]]
description = "tests/ 底下的測試哨兵假密碼：值以 sentinel/s3ntinel 加 -/_ 開頭（gitleaks-test-sentinel）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/''']
regexTarget = "secret"
regexes = ['''(?i)^s[e3]ntinel[-_]''']

# 驗收測試用「看得出是假的」16 位 hex 雜湊鍵（測短帳號夾在雜湊鍵裡不算洩漏）；測試已鎖定且掃歷史
# 只放行 tests/ 底下、值為 10～22 位小寫 hex、以 0123 開頭且接著出現 456789 的 generic-api-key
[[allowlists]]
description = "tests/ 底下的順序假雜湊鍵：小寫 hex，0123 開頭、含 456789（gitleaks-hash-key-fixture）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/''']
regexTarget = "secret"
regexes = ['''^0123[0-9a-f]{0,6}456789[0-9a-f]{0,6}$''']
