# 擴充預設規則；只排除 tasks/ 封存路徑（D-018）
# NOTE: 封存派工單與報告會引用誤判內容，逐筆加 fingerprint 會無限循環
title = "radar gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "tasks/ 封存派工單、qa／review 紀錄（D-018）"
paths = ['''^tasks/''']

[[allowlists]]
description = "Git／Hugging Face revision：變數名含 rev/revision/commit/sha 且值為 40 位小寫 hex（D-026）"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(?i:rev|revision|commit|sha)[a-zA-Z0-9_]*\s*[:=]+\s*(?:"[0-9a-f]{40}"|'[0-9a-f]{40}'|[0-9a-f]{40}(?:[^0-9a-zA-Z]|$))''']
