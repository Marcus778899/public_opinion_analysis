name: CI

permissions:
  contents: read

# PR 開到 develop / main 時先跑一次；合併（push）到 develop / main 後再跑一次
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 覆蓋率檢查要跟 develop 比 diff
      # 專案初始化（INIT）合併前還沒有 Makefile，後續步驟全部跳過
      - name: Detect Makefile
        id: detect
        run: if [ -f Makefile ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      # TODO(INIT): architect 依技術棧調整下面的語言版本
      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      # CI 用 .env.example 的預設值；需要機密的測試改用 GitHub secrets
      - name: Prepare env
        if: steps.detect.outputs.found == 'true'
        run: if [ -f .env.example ]; then cp .env.example .env; fi
      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: make ci-setup
      - name: Check
        if: steps.detect.outputs.found == 'true'
        run: make check
      # 改到的程式碼覆蓋率（scripts/coverage_gate.py，門檻 80%）：只在開到 develop 的 PR 檢查；發版 PR 是已逐張檢查過的累積
      # make coverage 把 Cobertura／JaCoCo XML 寫到 coverage-reports/（寫法見 .claude/skills/backend-standards/references/）
      # 需要 DB 時在這步之前加 docker compose up -d <服務>：測試在 runner 上跑，在容器裡跑報告路徑會對不回 repo
      - name: Set up Python for coverage gate  # 不要刪：coverage_gate.py 與 diff-cover 需要，跟專案語言無關
        if: steps.detect.outputs.found == 'true' && github.event_name == 'pull_request' && github.base_ref == 'develop'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coverage of changed lines (diff-cover)
        if: steps.detect.outputs.found == 'true' && github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          DIFF_COVER_VERSION: "10.6.0"
          # TODO(INIT): 用 JaCoCo（Java／Kotlin）時填原始碼目錄，空白分隔，例："backend/src/main/java"
          COVERAGE_SRC_ROOTS: ""
        run: |
          make coverage
          pip install -q "diff-cover==${DIFF_COVER_VERSION}"
          python3 scripts/coverage_gate.py "origin/${GITHUB_BASE_REF}"

  # 資安稽核：每個 PR 都跑，pr.py merge 要求所有 check 綠。工具與語言無關，版本固定，升級改這裡
  # 要忽略某個發現，寫進 osv-scanner.toml／.gitleaksignore／.semgrepignore 並附理由；這些檔在 fast 通道是受保護路徑，發版前 security 也會逐條檢查
  security:
    name: Security
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      OSV_SCANNER_VERSION: "2.6.0"
      SEMGREP_VERSION: "1.178.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 密鑰掃描要看整段歷史，刪掉的 secret 仍在 git 裡
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - name: Dependencies (osv-scanner)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source -r .
          code=$?
          set -e
          # 128：找不到任何相依清單（例：專案初始化前），不算失敗
          if [ "$code" -eq 128 ]; then echo "沒有相依清單，略過"; exit 0; fi
          exit "$code"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SAST (semgrep)
        run: |
          pip install -q "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/default --severity ERROR --error --metrics off --quiet
