name: Sync main to develop

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    name: Sync develop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync develop from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B develop origin/develop
          # 保底：release.py finish 會在本機併回 develop，通常這裡已經沒事做
          if git merge-base --is-ancestor origin/main HEAD; then echo "develop 已包含 main"; exit 0; fi
          git merge --ff-only origin/main || git merge --no-edit origin/main
          if ! git push origin develop; then
            # 被 release.py finish 搶先 push：develop 已包含 main 就算成功
            git fetch origin develop
            git merge-base --is-ancestor origin/main origin/develop
          fi
