<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設計稿：<功能></title>
  <!-- 字體：設計系統選的 Google Fonts（前端用同一組）；token 的字體變數要有系統字體 fallback -->
  <!-- 設計 token：相對路徑引用 architect 指定的那一份，不要複製 -->
  <link rel="stylesheet" href="../../../<token 路徑>">
  <style>
    /* 只放設計稿本身的排版（狀態標籤、分隔），畫面樣式用 token；圖示用 inline SVG，不用 emoji */
    body { margin: 0; font-family: var(--font-body, system-ui, sans-serif); background: var(--color-bg, #fff); color: var(--color-text, #111); }
    .state { padding: 24px; border-bottom: 1px dashed #999; }
    .state > h2 { font: 600 12px/1 monospace; color: #666; margin: 0 0 16px; text-transform: uppercase; }
  </style>
</head>
<body>
  <!-- 每個畫面 × 每個狀態一個 section；用假資料，不寫 JS 邏輯 -->
  <section class="state" id="list-empty">
    <h2>清單：空</h2>
  </section>
  <section class="state" id="list-loading">
    <h2>清單：載入中</h2>
  </section>
  <section class="state" id="list-error">
    <h2>清單：錯誤</h2>
  </section>
  <section class="state" id="list-filled">
    <h2>清單：有資料</h2>
  </section>
</body>
</html>
