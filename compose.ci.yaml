# CI 用覆寫檔：把四個服務的 port 綁在 runner 的 127.0.0.1，測試與覆蓋率直接在 runner 上跑（開發規格 7.26 做法 10）
# 用法：docker compose --env-file .env -f compose.yaml -f compose.ci.yaml up -d --wait kafka postgres clickhouse grafana

services:
  kafka:
    ports:
      - "127.0.0.1:${IT_KAFKA_HOST_PORT:?IT_KAFKA_HOST_PORT 未設定}:9092"
    environment:
      KAFKA_LISTENERS: 'INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka_1:29092,EXTERNAL://127.0.0.1:${IT_KAFKA_HOST_PORT}'
  postgres:
    ports:
      - "127.0.0.1:${IT_POSTGRES_HOST_PORT:?IT_POSTGRES_HOST_PORT 未設定}:5432"
  clickhouse:
    ports:
      - "127.0.0.1:${IT_CLICKHOUSE_HOST_PORT:?IT_CLICKHOUSE_HOST_PORT 未設定}:8123"
  # NOTE: 只接 internal network 的容器無法發布 port，所以另接預設 network；CI 的離線證據不由這裡提供（7.25）
  grafana:
    ports:
      - "127.0.0.1:${IT_GRAFANA_HOST_PORT:?IT_GRAFANA_HOST_PORT 未設定}:3000"
    networks: [default, grafana_offline]
